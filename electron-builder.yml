appId: shop.dpl.store.desktop
productName: DPS Store Desktop
directories:
  output: release
files:
  - dist/**
  - renderer/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.business
  identity: null # 코드 사이닝 미적용 (Gatekeeper 경고 회피는 사용자가 우클릭 → 열기로 처리)
publish:
  provider: github
  owner: tils-ai
  repo: dps-store-desktop
  # electron-builder는 GitHub 릴리즈를 기본 draft로 만든다(=수동 Publish 필요).
  # 장비 레포(softprops/action-gh-release)처럼 태그 푸시 시 바로 발행되도록 release로 고정 —
  # draft로 남아 electron-updater가 못 보고 자동 업데이트가 안 나가던 함정 방지.
  releaseType: release
