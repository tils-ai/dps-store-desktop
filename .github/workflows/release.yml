name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # windows-latest(2025+) 이미지의 VS 버전을 node-gyp@9가 인식 못 해
        # serialport 네이티브 리빌드가 실패한다 — VS2022 이미지로 고정.
        os: [windows-2022, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@a0ea98b2dc7d387a59324835f7421c1d5f8357b4 # v6.0.5
        with:
          version: 10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: pnpm

      # node-gyp@9가 distutils를 import하는데 Python 3.12+에서 stdlib에서 제거됐다.
      # serialport/bindings-cpp 같은 native 모듈 빌드를 위해 Python 3.11 고정.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - run: pnpm install --frozen-lockfile

      - name: Build & Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # macOS 코드 사이닝 스킵
        run: pnpm release
