<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DPS Store Desktop · Setup</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        background: #0e0f12;
        color: #f5f5f7;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        background: #1a1c20;
        padding: 40px 48px;
        border-radius: 12px;
        min-width: 380px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
      p.sub { margin: 0 0 22px; color: #8b8d92; font-size: 13px; }
      label { display: block; margin-bottom: 8px; font-size: 13px; color: #c8cad0; }
      input {
        width: 100%;
        padding: 12px 14px;
        background: #0e0f12;
        border: 1px solid #2a2c31;
        color: #f5f5f7;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
      }
      input:focus { border-color: #5b8cff; }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        background: #5b8cff;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { background: #3a3b40; cursor: not-allowed; }
      .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
      .msg.err { color: #ff6b6b; }
      .msg.ok { color: #5fd17a; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>스토어 연결</h1>
      <p class="sub">테넌트 이름을 입력하세요.</p>
      <label for="t">테넌트 이름</label>
      <input id="t" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus />
      <button id="ok">확인</button>
      <div id="msg" class="msg"></div>
    </div>
    <script>
      const input = document.getElementById("t");
      const button = document.getElementById("ok");
      const msg = document.getElementById("msg");

      function setMsg(text, kind) {
        msg.textContent = text;
        msg.className = "msg" + (kind ? " " + kind : "");
      }

      async function submit() {
        const name = input.value.trim();
        if (!name) return;
        button.disabled = true;
        setMsg("확인 중...", "ok");
        try {
          const result = await window.electronAPI.resolveTenant(name);
          if (result.ok) {
            setMsg(result.data.brandName + " 연결 완료. 잠시 후 재시작합니다.", "ok");
            await window.electronAPI.saveTenant(result.data);
          } else {
            let m = result.error || "오류가 발생했습니다.";
            if (result.status === 404) m = "존재하지 않는 테넌트입니다.";
            else if (result.status === 422) m = "사용할 수 없는 이름입니다.";
            else if (result.status === 429) m = "잠시 후 다시 시도해주세요.";
            else if (result.status === 0) m = "네트워크에 연결할 수 없습니다.";
            setMsg(m, "err");
            button.disabled = false;
          }
        } catch (e) {
          setMsg("알 수 없는 오류: " + (e && e.message ? e.message : e), "err");
          button.disabled = false;
        }
      }

      button.addEventListener("click", submit);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
    </script>
  </body>
</html>
