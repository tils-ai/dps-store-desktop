<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>키오스크 진입</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
        background: #1a1c20;
        color: #f5f5f7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        -webkit-app-region: drag;
      }
      .card { width: 100%; -webkit-app-region: no-drag; }
      h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
      p.sub { margin: 0 0 14px; color: #8b8d92; font-size: 12px; }
      input {
        width: 100%;
        padding: 10px 12px;
        background: #0e0f12;
        border: 1px solid #2a2c31;
        color: #f5f5f7;
        border-radius: 6px;
        font-size: 14px;
        outline: none;
      }
      input:focus { border-color: #5b8cff; }
      .row { display: flex; gap: 8px; margin-top: 12px; }
      button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button.primary { background: #5b8cff; color: white; }
      button.primary:disabled { background: #3a3b40; cursor: not-allowed; }
      button.ghost { background: transparent; color: #8b8d92; border: 1px solid #2a2c31; }
      .msg { margin-top: 8px; font-size: 12px; min-height: 16px; }
      .msg.err { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>키오스크 모드 진입</h1>
      <p class="sub">이 세션에서 사용할 임시 비밀번호를 입력하세요. (4자 이상)</p>
      <input id="pw" type="password" autofocus />
      <div class="row">
        <button id="cancel" class="ghost">취소</button>
        <button id="ok" class="primary">진입</button>
      </div>
      <div id="msg" class="msg"></div>
    </div>
    <script>
      const pw = document.getElementById("pw");
      const ok = document.getElementById("ok");
      const cancel = document.getElementById("cancel");
      const msg = document.getElementById("msg");

      function setErr(text) {
        msg.textContent = text || "";
        msg.className = "msg" + (text ? " err" : "");
      }

      async function submit() {
        const v = pw.value;
        if (!v || v.length < 4) { setErr("4자 이상 입력하세요."); return; }
        ok.disabled = true;
        const res = await window.electronAPI.kioskSetPassword(v);
        if (!res.ok) { setErr(res.error || "오류가 발생했습니다."); ok.disabled = false; }
      }

      ok.addEventListener("click", submit);
      cancel.addEventListener("click", () => window.electronAPI.kioskCancelModal());
      pw.addEventListener("keydown", (e) => {
        if (e.key === "Enter") submit();
        if (e.key === "Escape") window.electronAPI.kioskCancelModal();
      });
    </script>
  </body>
</html>
